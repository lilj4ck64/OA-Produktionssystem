name: Native releases

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.workflow }}

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            goos: windows
            goarch: amd64
            platform: windows-x64
            extension: zip
          - name: Linux x64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-x64
            extension: tar.gz
          - name: macOS ARM64
            os: macos-15
            goos: darwin
            goarch: arm64
            platform: macos-arm64
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build Java libraries and minimal runtime
        shell: bash
        run: |
          bash java-toolchain/gradlew -p java-toolchain syncRuntimeLibs jlinkRuntime
      - name: Assemble package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: latest
          PLATFORM: ${{ matrix.platform }}
        run: |
          package="oa-satzsystem-${VERSION}-${PLATFORM}"
          mkdir -p "dist/$package/resources"
          binary="oa"
          if [[ "$GOOS" == "windows" ]]; then binary="oa.exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "dist/$package/$binary" ./cmd/oa
          gui_binary="OA-Satzsystem"
          gui_ldflags="-s -w -X main.version=$VERSION -X main.defaultCommand=gui"
          if [[ "$GOOS" == "windows" ]]; then
            gui_binary="$gui_binary.exe"
            gui_ldflags="$gui_ldflags -H windowsgui"
          fi
          go build -trimpath -ldflags="$gui_ldflags" -o "dist/$package/$gui_binary" ./cmd/oa
          cp -R java-toolchain/build/stage/lib "dist/$package/lib"
          cp -R java-toolchain/build/stage/runtime "dist/$package/runtime"
          cp -R Stylesheets Shared "dist/$package/resources/"
          cp -R Example "dist/$package/"
          cp README.md "dist/$package/"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - name: Create archive
        shell: bash
        env:
          ARCHIVE_EXTENSION: ${{ matrix.extension }}
        run: |
          cd dist
          if [[ "$ARCHIVE_EXTENSION" == "zip" ]]; then
            7z a -tzip "$PACKAGE.zip" "$PACKAGE"
          else
            tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/oa-satzsystem-latest-${{ matrix.platform }}.${{ matrix.extension }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Move existing latest tag to this build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.zip
            dist/*.tar.gz
