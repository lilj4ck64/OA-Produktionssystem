{{define "login"}}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – OA Satzsystem</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body><main>
  <header><p class="eyebrow">Geschützter Server</p><h1>Anmelden</h1><p>Mit deinem OA-Benutzerkonto fortfahren.</p></header>
  {{if .Error}}<div class="notice error">{{.Error}}</div>{{end}}
  <section class="card">
    <form action="/login" method="post" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <label><span>Benutzername</span><input type="text" name="username" autocomplete="username" required autofocus></label>
      <label><span>Passwort</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">Anmelden</button>
    </form>
  </section>
</main></body>
</html>
{{end}}
