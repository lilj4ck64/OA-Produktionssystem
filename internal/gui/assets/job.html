{{define "job"}}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build – OA Satzsystem</title>
  <link rel="icon" type="image/jpeg" href="/static/icon.jpg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Buildauftrag</p>
      <h1>{{.Project}}</h1>
      <p id="status">Status: {{.Status}}</p>
    </header>
    <section class="card">
      <h2>Fortschritt und Logs</h2>
      <progress id="progress" max="100" value="{{.Progress}}"></progress>
      <pre id="logs">{{.Logs}}</pre>
      {{if .Local}}
      <p id="save-status" class="notice" role="status">Die fertigen Dateien werden automatisch im Ordner <code>Outputs</code> neben der Anwendung gespeichert.</p>
      {{end}}
      <div id="artifacts"></div>
      <p><a class="button secondary" href="/">Zurück zur Übersicht</a></p>
    </section>
  </main>
  <script>window.OA_JOB_ID = {{.ID}};</script>
  {{if .Local}}<script src="/static/lifecycle.js"></script>{{end}}
  <script src="/static/job.js"></script>
</body>
</html>
{{end}}
